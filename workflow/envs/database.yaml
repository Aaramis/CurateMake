# workflow/envs/database.yaml
name: database
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python et packages de base
  - python=3.10
  - pip

  # Base de données et ORM
  - sqlite=3.45

  # Packages scientifiques
  - numpy=1.24
  - pandas=2.0
  - scipy=1.10

  # Bioinformatique
  - biopython=1.81
  - biom-format=2.1

  # Utilitaires et parsing
  - pyyaml=6.0
  - jsonschema=4.17
  - tqdm=4.65

  # Visualisation et rapports
  - matplotlib=3.7
  - seaborn=0.12
  - plotly=5.14
  - jinja2=3.1

  # Validation et qualité
  - pytest=7.3
  - black=23.3

  # Packages via pip
  - pip:
    - hashlib
    - uuid
name: sativa
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - biopython
  - pandas
  - sqlalchemy=2.0
  - psycopg2=2.9
  - numpy
  - ete3
  # EPA-ng: leave-one-out placement engine (replaces the default RAxML -f O,
  # see workflow/scripts/Sativa/sativa/README_MODIFICATIONS.md).
  - epa-ng=0.3.8
  # NOTE: RAxML is NOT installed here. SATIVA invokes the RAxML 8.2.3 binaries
  # shipped in its own bundle (workflow/scripts/Sativa/sativa/raxml/, via
  # run_raxml.sh), for the reference-tree build (mfresolv) and the final EPA
  # confirmation step; no environment RAxML is needed.
  - pip
  - pip:
    - psutil
    - plotly==5.20.0

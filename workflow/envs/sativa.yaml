name: sativa
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - biopython
  - pandas
  - sqlalchemy=2.0
  - psycopg2=2.9
  - numpy
  # Neither ete3 nor epa-ng is declared any more. Both existed for the SATIVA copy that
  # used to live in this repository; the packaged tool brings its own placement engine and
  # RAxML in envs/sativa_epang.yaml, and nothing in our own scripts imports ete3. Dropping
  # it also drops Qt, which it pulled in at 141 MB and which a pipeline with no GUI never
  # needed -- and which is what broke the first run after the migration, through a
  # corrupted qt-main entry in the package cache.
  # integrate_sativa.py imports col_taxonomic_matcher, which imports requests at
  # module level. It only ever resolved because `script:` rules inherit the
  # PYTHONPATH of the environment Snakemake itself runs in -- a pure-Python package
  # crossing a 3.13 -> 3.10 boundary by accident. A `shell:` rule gets no such
  # inheritance, and sativa_vote died at import (0-byte log, empty consensus,
  # every SATIVA correction silently dropped). Declare the dependency.
  - requests
  - pip
  - pip:
    - psutil
    - plotly==5.20.0

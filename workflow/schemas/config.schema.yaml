$schema: "https://json-schema.org/draft/2020-12/schema"
description: >
  CurateMake pipeline configuration. Permissive schema: it checks that the required
  sections exist and that the user-tunable knobs have sane types/ranges, but allows
  extra keys everywhere (additionalProperties: true) so it does not fight the config.
type: object
additionalProperties: true
required:
  - database
  - databases
  - msa
  - sativa

properties:

  itsx_cpu:
    type: integer
    minimum: 1
  itsx_deterministic:
    type: boolean

  database:
    type: object
    additionalProperties: true
    required: [type]
    properties:
      type:
        type: string
        enum: [sqlite, postgresql]

  databases:
    type: object
    additionalProperties: true
    minProperties: 1

  msa:
    type: object
    additionalProperties: true
    required: [csv_path, barcodes, output_report, clustered]
    properties:
      csv_path:
        type: string
      output_report:
        type: string
      create_indexes:
        type: boolean
      barcodes:
        type: array
        minItems: 1
        items:
          type: string
      clustered:
        type: object
        additionalProperties: true
        properties:
          cluster_id:
            type: number
            minimum: 0
            maximum: 1
          cluster_cov:
            type: number
            minimum: 0
            maximum: 1
          min_ref:
            type: integer
            minimum: 1
          max_group:
            type: integer
            minimum: 1
          max_cluster_reps:
            type: integer
            minimum: 0
          sativa_min_seqs:
            type: integer
            minimum: 1
          threads:
            type: integer
            minimum: 1

  sativa:
    type: object
    additionalProperties: true

  sativa_integration:
    type: object
    additionalProperties: true

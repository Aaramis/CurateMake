site_name: CurateMake
site_description: Snakemake workflow for curating and validating ITS reference sequences
site_author: Auguste Gardette

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Database: database.md
  - ITSx: ITSx.md
  - MSA: MSA.md
  - Alignment strategy: alignment-strategy.md
  - Personal database: personal-database.md
  - Tools: tools.md
  - Development: dev.md
  - Contribution: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true
  - pymdownx.tabbed
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.arithmatex

# CurateMake — minimal local test configuration.
#
# Same pipeline and same code as config.yaml, but sized for one workstation:
# the SQLite backend, the mini source dumps shipped in resources/, and the
# thread/job counts cut to single digits. config.yaml is the reference used for
# the full-database run (PostgreSQL/YugabyteDB, 120 cores).
#
#   snakemake -s workflow/Snakefile --configfile config/config_minitest.yaml \
#             --use-conda --cores 8
#
# Values changed from config.yaml, and nothing else: database.type, the four
# source paths, and the compute knobs marked below. The science knobs are
# untouched except sativa.replicates, lowered from 10 to 3 so the consensus
# vote still runs without ten SATIVA passes; published runs use 10.

# Compute resources
itsx_cpu: 4
itsx_deterministic: false  # Set to true for reproducible results (slower, single-threaded)


# Database configuration
database:
  # Backend type: "sqlite" (dev/small datasets) or "postgresql" (production/large datasets)
  type: "sqlite"

  # SQLite settings (development, datasets < 1M sequences)
  sqlite:
    path: "results/db"
    name: "its_mini_database.db"

  # PostgreSQL is NOT used here; see config.yaml for the production backend.
  # These literals are deliberate and must stay. Snakemake MERGES this file over
  # config.yaml rather than replacing it, and the Snakefile expands env placeholders
  # for every key it finds, so config.yaml's "{{ env.POSTGRES_* }}" entries would
  # survive the merge and abort the run with "Environment variable POSTGRES_HOST not
  # found" even in sqlite mode. Overriding them with plain strings is what prevents that.
  postgresql:
    host: "unused-in-sqlite-mode"
    port: 5432
    user: "unused"
    password: "unused"
    database: "unused"
    schema: "its_curate"
    pool_size: 5
    max_overflow: 10
    echo: false

  # Retry configuration for distributed databases (e.g., YugabyteDB)
  # db_manager will automatically retry transient errors
  writer_retry:
    max_attempts: 5   # SQLite local: pas de retransmissions reseau a absorber


# Database formatting configuration
# These parameters control ALL database operations through db_manager
database_formatting:
  # Universal batch size for bulk inserts and fetch operations
  # Used by: bulk_insert_sequences, bulk_insert_taxonomies, bulk_insert_seq_tax
  # Adjust based on your database performance (lower for slower networks)
  batch_size: 2000

  # Chunk size for complex taxonomy queries with multiple OR conditions
  # Used for: fetching tax_ids for unique taxonomies
  # Lower values reduce query complexity and avoid RPC timeouts
  taxonomy_fetch_chunk_size: 10

# Source datasets. Full production dumps are active; the mini_* test set is kept
# commented for a quick swap back (uncomment mini / comment full to run the test).
databases:
  unite:
    # path: "resources/UNITE/UNITE_public_19.02.2025.fasta.gz"
    path: "resources/UNITE/mini_UNITE_public.fasta.gz"

  bold:
    # path: "resources/BOLD/BOLD_Public.22-Aug-2025.tar.gz"
    path: "resources/BOLD/mini_BOLD_Public.tar.gz"

  planits:
    # path: "resources/PLANITS/PLANiTS_29-03-2020.zip"
    path: "resources/PLANITS/mini_PLANiTS.zip"

  caledna:
    files:
      # - "resources/CALeDNA/PITS_fasta_and_taxonomy.zip"
      # - "resources/CALeDNA/FITS_fasta_and_taxonomy.zip"
      - "resources/CALeDNA/mini_PITS_fasta_and_taxonomy.zip"
      - "resources/CALeDNA/mini_FITS_fasta_and_taxonomy.zip"

  # PERSONAL — user-provided custom sequences.
  # Expected FASTA header format (taxonomy embedded; missing ranks allowed):
  #   >ID;barcode=ITS;kingdom=Fungi;phylum=Basidiomycota;class=Agaricomycetes;order=Russulales;family=Russulaceae;genus=Russula;species=Russula_abietina
  # Use "path" for a single file, or "files" for several. See docs/personal-database.md.
  # Enabled HERE ONLY, to exercise the personal-source path on the fixture shipped with
  # the repository. personal_test.fasta holds 1,971 SIMULATED reads (headers carry
  # "read identity=..%") over 21 species, mostly Carex -- fine as a test input, never as a
  # real source. config.yaml keeps it DISABLED since 2026-08-16: in the full run ITSx
  # expanded it to 10,929 rows, i.e. test data inside a production database, and it was the
  # source with the LOWEST SATIVA modification rate (8.04% vs 24.45% for CALeDNA_FITS), so
  # it flattered the global statistics.
  personal:
    path: "resources/PERSONAL/personal_test.fasta"


# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"


# Benchmarking
benchmarking:
  enabled: true
  output_dir: "benchmarks"


# Sequence validation rules
sequence_validation:
  min_length: 50
  max_n_fraction: 0.5
  valid_chars: "ACGTURYSWKMBDHVN-"


# Deduplication configuration
deduplication:
  # Create indexes before deduplication (improves query performance)
  create_indexes: true

  # Skip integrity verification after deduplication
  # Set to true to avoid temp_file_limit errors on large datasets (YugabyteDB)
  skip_verify_integrity: false   # SQLite n a pas la limite de fichiers temporaires de YugabyteDB

  # Tax ID batch size for processing (reduces temp file usage in YugabyteDB)
  # Each batch fetches sequences for N tax_ids at once
  # Lower values = more queries but less DB memory/temp file usage
  # Higher values = fewer queries but more DB memory/temp file usage
  # Recommended: 50-200 for YugabyteDB, 500-1000 for local PostgreSQL
  tax_id_batch_size: 500

  # Logging frequency (purely informational)
  barcode_log_every: 20


# Catalogue of Life API configuration
# The rate is set high: effective throughput is bounded by worker concurrency, not this
# value. The client keeps a thread-safe limiter + 429/Retry-After handling as a safety net.
CoL_api:
  # Reproducibility: CoL release to pin. "3LR" = latest CoL release, resolved at run
  # start and frozen for the whole run; its version + DOI are recorded in
  # results/processed/col_matching_report.json (col_source). Set a specific release key
  # (e.g. 315777 = COL26.7, DOI 10.48580/dgyhw) to replay the exact same version.
  # "3" = live CoL project (NOT reproducible) — discouraged.
  dataset: "3LR"
  max_requests_per_second: 20   # poli depuis un poste de travail
  max_workers: 8                # requetes CoL concurrentes
                                # does not compete with --cores, so max it out)
  batch_size: 200


# Multiple Sequence Alignment (MSA) configuration
msa:
  # Sequence extraction (prepare_msa). The MSA construction itself is backbone + ensemble-HMM (below).
  # Batch size for extraction (uses database_formatting.batch_size if not set):
  # batch_size: 10000
  create_indexes: true             # sans risque sur SQLite, et plus rapide
  reannotate_barcodes:
    enabled: true            # fix ITS1/ITS2 labels ITSx could not verify (pre-trimmed sources):
                             # 85.8% of BOLD-style '<id>.ITS1' entries are in fact ITS2
    apply: true              # false = report what would change without writing
    reference_per_region: 2000     # jeu mini: quelques milliers de sequences au total
    min_seq_id: 0.70
    min_coverage: 0.70
    threads: 2
    mmseqs_env: "mmseqs"
    itsx_dir: "results/ITSx"
  barcodes: ["ITS", "ITS1", "ITS2"]
  csv_path: "results/full.csv"
  output_report: "reports/html/msa_analysis_report.html"
  # === Group packing + manifest aggregation (cf. msa_groups.smk, ehmm_msa.smk) ===
  # Cluster the whole barcode by SEQUENCE (mmseqs2), merge clusters of similar taxonomy into
  # kingdom-interleaved groups up to a SIZE cap (SATIVA tolerates gappy MSAs, so size is the real
  # bound), align + trimAl -> SATIVA. A contaminant clusters with its true kin, so cross-clade /
  # cross-kingdom contamination is visible to SATIVA (validated at scale, cf. SIMULATION_REPORT.md).
                           #   clustered: mmseqs cluster -> kingdom-interleaved bounded
                           #     groups -> one MAFFT per group. Bounded by ALIGNMENT quality
                           #     (collapses past ~20k, cf. clustered.max_group).
                           #   ehmm: one backbone alignment gives every read the same column
                           #     frame (per-clade HMMs project them in), so groups are a free
                           #     slice and no per-group MAFFT is needed. Measured on the
                           #     CoL-harmonised sim (arm-level, 20.eHMM_MSA_prototype):
                           #     cross-kingdom 57.3% vs 47.6%, false positives 7.1% vs 20.1%,
                           #     20k task in ~33 min vs 1-2 h. Not yet run in-pipeline.
  ehmm:
    work_dir: "results/MSA/ehmm"
    backbone_target: 300        # ossature reduite: le jeu mini tient en quelques milliers
                                # mafft-linsi); this alignment defines the shared frame
    backbone_min_per_stratum: 3
    backbone_source: cluster    # cluster = representatives of the largest mmseqs clusters, so the
                                # backbone covers SEQUENCE space (what a profile HMM models) rather
                                # than the declared-label space. Measured on the real ITS2 (1.4M
                                # seqs, 1300-row budget, subsets of 10): taxonomy-stratified assigns
                                # 66.1% of reads, cluster representatives 81.1%. Largest-first also
                                # beats spreading picks over the size-ranked list (81.1 vs 70.2).
    backbone_cluster_id: 0.90   # mmseqs linclust identity for that representative selection
    backbone_aligner: "mafft-linsi"   # mafft-linsi assigns 77.6% of reads vs 72.3% for plain
                                      # mafft (35 s): worth the one-off cost
    min_col_occ: 0.10           # keep backbone columns occupied by >=10% of rows. A raw ITS
                                # backbone (7% occupancy over ~6700 cols) yields HMMs so
                                # diluted they miss ~90% of reads; at 10% (~1000 cols) nhmmer
                                # recognises ~77%.
    bucket_mode: upp            # upp = many small profiles, the granularity UPP actually uses.
                                # Measured on the real ITS1 (1.4M seqs, same backbone, same 10k
                                # queries): 4 clade-level HMMs assign 20.4% of reads, 108
                                # UPP-style ones assign 72.8%. One profile cannot model 6781
                                # fungal genera. `clade` keeps the old behaviour, for comparison.
    subset_size: 10             # backbone rows per profile, cut inside (kingdom,phylum,order).
                                # Profile COMPACTNESS is the lever, not profile count nor backbone
                                # size. Measured on the real ITS2 (1.4M seqs, 10k queries): at a
                                # fixed 1300-row backbone, 25 -> 60.1% assigned and 10 -> 66.1%.
                                # A 9x bigger backbone (12000 rows, 1264 profiles) only reaches
                                # 69.1%, and 5000:25 (290 profiles) does WORSE than 1300:10 (177),
                                # so what matters is how tight each profile is. This is UPP's own
                                # design: a small backbone split into many small profiles.
    bucket_rank: kingdom        # one HMM per clade + a GLOBAL fallback
    min_bucket: 20
    recover_unassigned: true    # mmseqs rescue for the short reads nhmmer misses (+2184 of
                                # 7060 on the sim point, median length 166 bp vs 457)
    recover_min_id: 0.75
    recover_min_qcov: 0.60
    scaffold_every_group: true  # inject the backbone into EVERY group: a contaminant is only
                                # detectable when its TRUE clade is in the same MSA, and plain
                                # round-robin leaves the last groups with 2 kingdoms of 5
    threads: 2
    # 18 x 8 = 144 of the 150-core cgroup quota. Measured 2026-08-25: nhmmer delivers
    # 107 reads/s/core at --cpu 8 but only 80.8 at --cpu 32, so width is bought at a loss.
    nhmmer_jobs: 2
    nhmmer_threads: 2
    # hmmalign has no --cpu (HMMER 3.4), so one bucket = one core. Measured 2026-08-25:
    # the ITS projection spent 17.0 h of its 33.2 h on a single core with 138 buckets to do.
    # This is the only knob that puts more than one core on that phase.
    hmmalign_jobs: 4             # profils balayes simultanement
                              # Sequential, ITS needs ~14 min per profile (2.29M reads x
                              # 624 bp against a 940-column model) = over a day for 138,
                              # while one nhmmer at --cpu 32 leaves ~120 of the 150 cgroup
                              # cores idle. 4 x 32 = 128 fills them; RSS is ~3.2 Go each.
    # hmmer_bin: ""             # dir holding hmmbuild/nhmmer/hmmalign (empty = from PATH)
  groups:
    out_dir: "results/MSA/groups"
    summary: "results/MSA/groups/groups_summary.json"
    sativa_manifest: "results/MSA/groups/sativa_manifest.json"
    residual_report: "results/MSA/groups/residual_report.json"
    contamination_report: "results/MSA/groups/contamination_report.json"
    cluster_id: 0.97       # mmseqs2 identity (clean references cluster well at 0.97)
    cluster_cov: 0.80      # mmseqs2 coverage
    cluster_kmer_per_seq: 300  # mmseqs easy-linclust --kmer-per-seq. linclust runs in time
                           # LINEAR in the input where easy-cluster does not; this knob buys
                           # back the sensitivity it trades away. Measured on 206k real ITS
                           # sequences: 21 (mmseqs default) -> 95510 clusters in 5s, 300 ->
                           # 73458 in 9s, against easy-cluster's 72486 in 125s. At 826k the
                           # gap widens: 28s vs over 45 min.
    min_ref: 4             # clusters smaller than this are absorbed into the nearest cluster
    max_group: 20000       # DO NOT RAISE. Measured on the CoL-harmonised sim (s8/r15): at 20k the
                           # group MSA keeps ~180 informative columns and SATIVA corrects 47.6% of
                           # cross-kingdom mislabels in 1-2h/task; at ~35-40k the from-scratch MSA
                           # collapses (down to 21 columns) and SATIVA TIMES OUT at 6h (twice, K=25
                           # and K=5). Also the #tasks lever: ~total_reps/max_group SATIVA tasks.
    max_cluster_reps: 200  # cap the reps ONE CLUSTER (~near-identical species) contributes (0 = off).
                           # Applied PER cluster before consolidation, so a diverse clade keeps its
                           # within-clade resolution; all members kept in group_members.tsv.
    sativa_min_seqs: 4     # size floor for a unit/group to be sent to SATIVA (else absorbed / residual)
    mmseqs_env: "mmseqs"           # conda env providing mmseqs2
    tool_env: "its-pipeline-dev"   # conda env providing mafft + trimal + pandas
    threads: 2


# SATIVA configuration
sativa:
  output_dir: "results/SATIVA"
  # The sativa-epang executable, provided by envs/sativa_epang.yaml. A path works too.
  sativa_binary: "sativa-epang"
  # 6h (21600) was too tight: on 02/09/2026, 48 tasks of ~20k seqs blew past it and were
  # written as status=timeout, i.e. permanent holes Snakemake never retries. Same tasks
  # finish in ~0.4h when the node is healthy; the overruns all land in the nightly stall
  # window (~19h-12h). 12h absorbs that stall instead of turning it into missing data.
  timeout_seconds: 7200
  max_seq_count: 20000
  max_alignment_length: 5000
  sativa_mode: "ultrafast"
  confidence_threshold: 0.4
  taxonomy_code: "BOT"
  threads: 2               # threads par tache SATIVA -> epa-ng -T
                           # floor(--cores / threads), so raising this at constant --cores
                           # LOWERS peak RAM (fewer concurrent epa-ng reference trees) for the
                           # same CPU use -- the opposite of raising --cores. epa-ng's OpenMP
                           # scaling flattens past ~8, so 8 is the useful ceiling.
                           # With --cores 120: 15 tasks x 8 threads = 120 cores.
  rand_seed: 42

  # --- Consensus vote over several independent splits -----------------------
  # The group boundaries handed to SATIVA are an artefact of the traversal order, not of
  # biology, and the neighbourhood drives the verdict hard. Measured on ITS2 (2026-08-26,
  # three independent splits of the SAME 1 277 566 sequences): only 43% of the flags raised
  # by any one split are reproduced by another, and a SATIVA confidence of exactly 1.000
  # still leaves 29% unreproduced -- the confidence scores the placement WITHIN the given
  # neighbourhood, so it cannot see the arbitrariness of that neighbourhood. Fitting the
  # observed 0/1/2/3-vote counts identifies three populations: 41.8% never flagged, 47.3%
  # flagged ~38% of the time (the artefact zone) and 11.0% flagged by every split.
  #
  # `replicates: 1` reproduces the historical behaviour exactly -- the native split only,
  # no reslice, no vote rule, no extra column written. N > 1 re-cuts the SAME eHMM
  # projection with N-1 extra seeds (cheap: the backbone/nhmmer/hmmalign half does not
  # depend on the split), runs SATIVA on each, and integrates ONLY the consensus, so the
  # database shrinks instead of growing N-fold.
  replicates: 3
  # Fraction of the replicates that must agree before a flag is integrated at all.
  # Threshold = ceil(vote_threshold * replicates). At 10 replicates, 2/3 keeps 100% of the
  # always-flagged population while cutting the artefact zone from 38% to 4%.
  # WRITE IT AS A FRACTION. A decimal is taken literally: 0.667 x 3 = 2.001, so it would
  # demand 3 votes out of 3 instead of 2. "2/3" is exact at every replicate count.
  vote_threshold: "2/3"
  barcodes: ["ITS", "ITS1", "ITS2"]
  tax_levels: ["family", "genus", "order", "species"]
  max_parallel_jobs: 100   # advisory only (not wired). Real SATIVA concurrency is
                           # floor(--cores / sativa.threads); --resources sativa_jobs=N only
                           # binds if N is below that. Memory is NOT bounded by either: see
                           # the note in rules/sativa.smk.
  cleanup_temp_files: true
  temp_retention_hours: 24
  visualization_report: "reports/html/sativa_visualization_report.html"


# SATIVA integration configuration
sativa_integration:
  # Minimum SATIVA confidence a flag must carry to be integrated. 0 keeps everything.
  #
  # 0.511 is not arbitrary. Measured on the August 2026 full run, 905 403 flags: the
  # confidence histogram carries a discrete spike of 9 181 flags at EXACTLY 0.510,
  # against 285 at 0.508, 627 at 0.509 and 66 at 0.511. That spike is the stem-placement
  # signature: the whole placement weight sits on a branch BETWEEN two ranks, so the
  # placement cannot choose between them, and the confidence is an artefact of the tie
  # rather than a measure of support. Those flags are 3 650 completions, 3 113 simple
  # deletions, 2 012 substitutions and 472 multiple deletions, mostly at species (3 937)
  # and genus (3 553).
  #
  # Cutting just above it removes 10 739 flags, 1.19 % of the total: the spike plus the
  # 0.418-0.509 tail. Applied at integration, not through SATIVA's own -C, so it costs
  # nothing to change: no SATIVA re-run, only a re-integration.
  min_confidence: 0.511
  # CoL API configuration
  col_api:
    # Post-SATIVA CoL re-validation. Uses the SAME client as harmonize_taxo
    # (col_taxonomic_matcher): EXACT search + synonym resolution + thread-safe rate
    # limiting + pinned DOI'd release.
    dataset: "3LR"               # pinned CoL release (see CoL_api.dataset)
    max_requests_per_second: 20
    timeout_per_request: 30
    # Parallel CoL resolution inside ONE clade job, mirroring the early pipeline's
    # CoL_api.max_workers (32, single process). Here many clade jobs run at once,
    # so the budget that matters is (concurrent clade jobs) x max_workers ~= 32.
    # Measured: serial resolution crawled to one answer per 25-90s per job once
    # ~90 jobs each waited on their own connection; 30 parallel requests come back
    # in 0.13s. Raise --cores and this together, never one alone.
    max_workers: 8

  # Cache configuration
  cache:
    enabled: true
    max_memory_entries: 20000
    file_cache_path: "cache/col_validation_cache.pkl"

  # Performance tuning
  performance:
    max_workers_files: 4
    bulk_insert_size: 1000

  # Reporting
  reconcile_barcodes:
    enabled: true   # propagate each SATIVA verdict to the sibling barcodes (ITS/ITS1/ITS2)
                    # of the same read; arbitration is chosen by rank_by below
    apply: true     # false = report what would change without writing
    # How a conflict between sibling barcodes of the same read is settled.
    #   votes      (default) number of independent splits that agreed, then lineage depth,
    #              then SATIVA confidence. A sibling with no voted correction scores 0, so a
    #              modification retained by the vote on ONE barcode is propagated to the
    #              others -- deliberate: with 10 splits a surviving flag is ~15% artefact
    #              instead of ~63% for a single split, which is the regime the old ordering
    #              was calibrated on. An exact tie (same votes, same depth, same confidence
    #              but different verdicts) is never guessed: both rows are left in place.
    #   confidence the pre-vote ordering. Falls back to it automatically when no vote data
    #              exists (sativa.replicates == 1), so nothing changes for a single-split run.
    # To be re-measured on the first full voted run against the 2026-08-25 baseline:
    # 734 555 conflicting anchors, 763 687 rows retyped, 189 538 ties left untouched.
    rank_by: "votes"
  reporting:
    export_json: true
    output_dir: "results/processed"

  # Database
  database:
    create_warnings_table: true


# Taxonomy sunburst report
taxonomy_sunburst:
  output: "reports/html/sativa_taxonomy_report.html"

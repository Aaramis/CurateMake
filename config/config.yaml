# Configuration des paramètres du pipeline

# Configuration de la base de données
database:
  path: "data/db"
  name: "its.db"
  backup_retention_days: 30
  vacuum_threshold_mb: 100


# Chemins des bases de données (à remplir manuellement)
databases:
  unite:
    # path: "/home/agardette/augmentation_taxonomie/5.mvp_snakemake/data/raw/UNITE/UNITE_large_test.fasta.gz"
    path: "/home/agardette/augmentation_taxonomie/5.mvp_snakemake/data/raw/UNITE/UNITE_public_19.02.2025.fasta.gz"  # Chemin vers le fichier UNITE téléchargé manuellement
    
  # Exemple pour d'autres bases de données (à décommenter et compléter si nécessaire)
  # bold:
  #   path: "data/raw/bold/bold_sequences.fasta"
  #   version: "latest"
  
  # planits:
  #   path: "data/raw/planits/planits_sequences.fasta"
  #   version: "latest"
  
  # caledna:
  #   path: "data/raw/caledna/caledna_sequences.fasta"
  #   version: "latest"

# Configuration logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_retention_days: 7

sequence_validation:
  min_length: 50          # Longueur minimale après nettoyage
  max_n_fraction: 0.5     # Fraction maximale de N autorisée
  valid_chars: "ACGTURYSWKMBDHVN-"  # Caractères valides
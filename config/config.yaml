# Pipeline configuration

# Compute resources
itsx_cpu: 1200   # threads assigned to ITSx


# Database configuration
database:
  # Backend type: "sqlite" (dev/small datasets) or "postgresql" (production/large datasets)
  type: "sqlite"

  # SQLite settings (development, datasets < 1M sequences)
  sqlite:
    path: "data/db"
    name: "its.db"

  # PostgreSQL settings (production, datasets > 1M sequences)
  postgresql:
    host: "{{ env.POSTGRES_HOST }}"
    port: "{{ env.POSTGRES_PORT }}"
    user: "{{ env.POSTGRES_USER }}"
    password: "{{ env.POSTGRES_PASSWORD }}"
    database: "{{ env.POSTGRES_DB }}"
    schema: "its_curate"
    pool_size: 10
    max_overflow: 20
    echo: false


  # Common settings
  backup_retention_days: 30
  vacuum_threshold_mb: 100


# Source datasets (adjust paths as needed)
databases:
  unite:
    path: "/home/agardette/augmentation_taxonomie/augmentation_taxonomie/6.CurateMake/data/raw/UNITE/mini_UNITE_public.fasta.gz"
    # path: "/home/agardette/augmentation_taxonomie/5.mvp_snakemake/data/raw/UNITE/UNITE_large_test.fasta.gz"
    
  bold:
    path: "/home/agardette/augmentation_taxonomie/augmentation_taxonomie/6.CurateMake/data/raw/BOLD/mini_BOLD_Public.tar.gz"
    # path: "/home/agardette/augmentation_taxonomie/5.mvp_snakemake/data/raw/BOLD/BOLD_small.tar.gz"
  
  planits:
    path: "/home/agardette/augmentation_taxonomie/augmentation_taxonomie/6.CurateMake/data/raw/PLANITS/mini_PLANiTS.zip"
    # path: "/home/agardette/augmentation_taxonomie/5.mvp_snakemake/data/raw/PLANITS/PLANITS_small.zip"
  
  caledna:
    files:
      - "/home/agardette/augmentation_taxonomie/augmentation_taxonomie/6.CurateMake/data/raw/CALeDNA/mini_PITS_fasta_and_taxonomy.zip"
      - "/home/agardette/augmentation_taxonomie/augmentation_taxonomie/6.CurateMake/data/raw/CALeDNA/mini_FITS_fasta_and_taxonomy.zip"
      # - "/home/agardette/augmentation_taxonomie/5.mvp_snakemake/data/raw/CALeDNA/FITS_fasta_and_taxonomy_small.zip"
      # - "/home/agardette/augmentation_taxonomie/5.mvp_snakemake/data/raw/CALeDNA/PITS_fasta_and_taxonomy_small.zip"

caledna_processing:
  batch_size: 2000
  writer_retry:
    max_attempts: 3
    initial_delay_seconds: 5
    backoff_factor: 2.0


# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_retention_days: 7

# Benchmarking
benchmarking:
  enabled: true
  output_dir: "benchmarks"
  generate_report: true

sequence_validation:
  min_length: 50
  max_n_fraction: 0.5
  valid_chars: "ACGTURYSWKMBDHVN-"

CoL_api:
  max_requests_per_second: 1000
  max_workers: 32
  batch_size: 1000

msa:
  min_seq_threshold: 20
  max_seq_threshold: 1000          # Nombre maximum de séquences par MSA
  large_task_threshold: 2000       # Seuil pour grandes tâches MSA (nécessitant traitement spécial)
  min_domain: "species"            # Niveau taxonomique minimum pour la descente hiérarchique
  trimal_seq_overlap: 75    # Pourcentage minimum d'overlap pour conserver une séquence
  trimal_res_overlap: 0.5   # Pourcentage de sequence avec un résidu à cet endroit
  domain: "family" # Descente de order à family car MSA pas terrible à order
  barcodes: ["ITS" ,"ITS1", "ITS2"]
  hierarchy_levels: ["genus", "family", "order", "class", "phylum"]
  tax_columns: ["kingdom", "phylum", "class", "order", "family", "genus", "species"]
  id_col: "seq_id"
  seq_col: "sequence"
  barcode_col: "barcode"
  # max_thread_workers: 180 # * Nombre de threads a utiliser par Barcode
  max_thread_workers: 50 # * Nombre de threads a utiliser par Barcode

  # Configuration de la classification parallèle avec hmmscan
  # hmmscan parallélise mieux avec 8-10 threads par processus
  # ATTENTION: Réduites pour éviter les crashes OOM (Out Of Memory)
  classification_max_workers: 20           # Nombre de processus hmmscan en parallèle (réduit de 14 à 6)
  # classification_max_workers: 24           # Nombre de processus hmmscan en parallèle (réduit de 14 à 6)
  classification_threads_per_worker: 4   # Threads par processus hmmscan
  classification_batch_size: 5000        # Séquences par batch (réduit de 10000 à 5000)
  classification_evalue_threshold: 1e-3  # E-value max to accept hmmscan assignment

  csv_path: "data/full.csv"
  msa_dir: "data/MSA"
  output_report: "reports/html/msa_analysis_report.html"
  task_manifest: "data/processed/msa_task_manifest.json"
  stage_markers:
    alignments: "data/processed/msa_alignments_complete.flag"
    trimming: "data/processed/msa_trimming_complete.flag"
    hmm_profiles: "data/processed/msa_hmm_complete.flag"
    combined_hmm: "data/processed/msa_combined_hmm_complete.flag"
    classification: "data/processed/msa_classification_complete.flag"
  classification_manifest: "data/MSA/classification/msa_classification_manifest.json"
  unprocessed_sequences_csv: "data/MSA/classification/msa_unprocessed_sequences.csv"
  global_hmm_raw: "data/MSA/combined/all_profiles_combined_raw.hmm"
  global_hmm: "data/MSA/combined/all_profiles_combined.hmm"
  hmm_filter:
    min_relent: 0.2
    min_prele: 0.2
    report_json: "data/MSA/combined/hmmstat_filter_report.json"
  classification_batches_dir: "data/MSA/classification/batches"
  classification_batches_json_dir: "data/MSA/classification/batches_json"
  classification_results_csv: "data/MSA/classification/msa_classification_assignments.csv"
  classification_stats_json: "data/MSA/classification/msa_classification_stats.json"
  assignment_integration_summary: "data/MSA/classification/msa_assignment_integration.json"

# SATIVA configuration
sativa:
  enabled: true
  input_msa_dir: "data/MSA"
  output_dir: "data/SATIVA"
  logs_dir: "logs/sativa"
  threads: 1
  max_parallel_jobs: 120
  mem_mb: 8000
  max_seq_count: 20000
  max_alignment_length: 30000
  sativa_mode: "ultrafast"
  rand_seed: 42
  visualization_report: "reports/html/sativa_visualization_report.html"
  confidence_threshold: 0.4
  taxonomy_code: "BOT"
  sativa_script_path: "workflow/scripts/Sativa/sativa/sativa.py"
  extra_args: ""
  barcodes: ["ITS", "ITS1", "ITS2"]
  tax_levels: ["family", "genus", "order", "species"]
  retry_on_oom: false
  timeout_seconds: 21600

  cleanup_temp_files: true
  temp_retention_hours: 24

  integration:
    enabled: true
    create_backup: true
    backup_dir: "data/db/backups"
    skip_verification: false
    only_successful: true
    min_confidence: 0.0

sativa_integration:
  # CoL API configuration
  col_api:
    max_requests_per_second: 100
    timeout_per_request: 30
    max_retries: 3

  # Cache configuration
  cache:
    enabled: true
    max_memory_entries: 100000
    file_cache_path: "cache/col_validation_cache.pkl"
    save_interval_seconds: 300

  # Performance tuning
  performance:
    max_workers_files: 10
    max_workers_col_api: 10
    chunk_size: 10000
    bulk_insert_size: 5000

  # Processing rules
  rules:
    process_validated: true
    process_deletion_simple: false
    process_deletion_multiple: true
    process_substitution: true
    process_completion: true
    deletion_multiple_threshold: 2

  # Reporting
  reporting:
    export_json: true
    export_csv_detailed: true
    export_csv_warnings: true
    max_sample_modifications: 1000
    output_dir: "data/processed"

  # Database
  database:
    create_warnings_table: true
    backup_before_integration: false

# Taxonomy sunburst report
taxonomy_sunburst:
  threshold: 50
  min_sequences: 1
  output: "reports/html/sativa_taxonomy_report.html"
  kingdom_colors:
    Fungi: "#7570b3"
    Plantae: "#1b9e77"
    Animalia: "#d95f02"
    Chromista: "#e7298a"
    Bacteria: "#66a61e"
    Protozoa: "#e6ab02"
  unknown_color: "#CCCCCC"              # Couleur pour les taxons "Unknown"
  gradient_intensity: 0.1                # Facteur d'éclaircissement par niveau (0-1)                                                                                                                                                                                                                       

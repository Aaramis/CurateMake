# Compute resources
itsx_cpu: 1200
itsx_deterministic: false  # Set to true for reproducible results (slower, single-threaded)


# Database configuration
database:
  # Backend type: "sqlite" (dev/small datasets) or "postgresql" (production/large datasets)
  type: "postgresql"

  # SQLite settings (development, datasets < 1M sequences)
  sqlite:
    path: "data/db"
    name: "its_mini_database.db"

  # PostgreSQL settings (production, datasets > 1M sequences).
  # Credentials come from .env (POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USER,
  # POSTGRES_PASSWORD, POSTGRES_DB) — the Snakefile raises if any is missing.
  postgresql:
    host: "{{ env.POSTGRES_HOST }}"
    port: "{{ env.POSTGRES_PORT }}"
    user: "{{ env.POSTGRES_USER }}"
    password: "{{ env.POSTGRES_PASSWORD }}"
    database: "{{ env.POSTGRES_DB }}"
    schema: "its_curate"
    pool_size: 10
    max_overflow: 20
    echo: false

  # Retry configuration for distributed databases (e.g., YugabyteDB)
  # db_manager will automatically retry transient errors
  writer_retry:
    max_attempts: 100  # High value for distributed DBs with transient errors


# Database formatting configuration
# These parameters control ALL database operations through db_manager
database_formatting:
  # Universal batch size for bulk inserts and fetch operations
  # Used by: bulk_insert_sequences, bulk_insert_taxonomies, bulk_insert_seq_tax
  # Adjust based on your database performance (lower for slower networks)
  batch_size: 10000

  # Chunk size for complex taxonomy queries with multiple OR conditions
  # Used for: fetching tax_ids for unique taxonomies
  # Lower values reduce query complexity and avoid RPC timeouts
  taxonomy_fetch_chunk_size: 10

# Source datasets (adjust paths as needed)
databases:
  unite:
    path: "data/raw/UNITE/mini_UNITE_public.fasta.gz"

  bold:
    path: "data/raw/BOLD/mini_BOLD_Public.tar.gz"

  planits:
    path: "data/raw/PLANITS/mini_PLANiTS.zip"

  caledna:
    files:
      - "data/raw/CALeDNA/mini_PITS_fasta_and_taxonomy.zip"
      - "data/raw/CALeDNA/mini_FITS_fasta_and_taxonomy.zip"

  # PERSONAL — user-provided custom sequences.
  # Expected FASTA header format (taxonomy embedded; missing ranks allowed):
  #   >ID;barcode=ITS;kingdom=Fungi;phylum=Basidiomycota;class=Agaricomycetes;order=Russulales;family=Russulaceae;genus=Russula;species=Russula_abietina
  # Use "path" for a single file, or "files" for several. See docs/personal-database.md.
  personal:
    path: "data/raw/PERSONAL/personal_test.fasta"


# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"


# Benchmarking
benchmarking:
  enabled: true
  output_dir: "benchmarks"
  generate_report: true


# Sequence validation rules
sequence_validation:
  min_length: 50
  max_n_fraction: 0.5
  valid_chars: "ACGTURYSWKMBDHVN-"


# Deduplication configuration
deduplication:
  # Create indexes before deduplication (improves query performance)
  create_indexes: true

  # Skip integrity verification after deduplication
  # Set to true to avoid temp_file_limit errors on large datasets (YugabyteDB)
  skip_verify_integrity: true

  # Tax ID batch size for processing (reduces temp file usage in YugabyteDB)
  # Each batch fetches sequences for N tax_ids at once
  # Lower values = more queries but less DB memory/temp file usage
  # Higher values = fewer queries but more DB memory/temp file usage
  # Recommended: 50-200 for YugabyteDB, 500-1000 for local PostgreSQL
  tax_id_batch_size: 100

  # Logging frequency (purely informational)
  barcode_log_every: 20


# Catalogue of Life API configuration
# The rate is set high: effective throughput is bounded by worker concurrency, not this
# value. The client keeps a thread-safe limiter + 429/Retry-After handling as a safety net.
CoL_api:
  # Reproducibility: CoL release to pin. "3LR" = latest CoL release, resolved at run
  # start and frozen for the whole run; its version + DOI are recorded in
  # data/processed/col_matching_report.json (col_source). Set a specific release key
  # (e.g. 315777 = COL26.7, DOI 10.48580/dgyhw) to replay the exact same version.
  # "3" = live CoL project (NOT reproducible) — discouraged.
  dataset: "3LR"
  max_requests_per_second: 400  # unthrottled (bounded by worker concurrency, not this rate)
  max_workers: 20               # number of concurrent CoL requests (capped at 32 in code)
  batch_size: 1000


# Multiple Sequence Alignment (MSA) configuration
msa:
  # Deterministic mode: when true, MAFFT uses a fully reproducible invocation
  # (FFT-NS-2, single thread, input order preserved) and sequences are sorted by
  # content before alignment. Default false = production behaviour (--auto, multithreaded).
  deterministic: false
  # Batch size for sequence extraction (uses database_formatting.batch_size if not set)
  # batch_size: 10000

  # Whether to create indexes before extraction (can timeout on YugabyteDB)
  create_indexes: false

  min_seq_threshold: 20
  max_seq_threshold: 1000          # Maximum number of sequences per MSA
  large_task_threshold: 2000       # Threshold for large MSA tasks (needing special handling)
  min_domain: "species"            # Minimum taxonomic level for the hierarchical descent
  trimal_seq_overlap: 75    # Minimum overlap percentage to keep a sequence
  trimal_res_overlap: 0.5   # Fraction of sequences with a residue at this position
  domain: "family" # Descend from order to family since MSA is poor at order level
  barcodes: ["ITS", "ITS1", "ITS2"]
  hierarchy_levels: ["genus", "family", "order", "class", "phylum"]
  tax_columns: ["kingdom", "phylum", "class", "order", "family", "genus", "species"]
  id_col: "seq_id"
  seq_col: "sequence"
  barcode_col: "barcode"
  max_thread_workers: 40 # Number of threads to use per barcode
  csv_path: "data/full.csv"
  msa_dir: "data/MSA"
  output_report: "reports/html/msa_analysis_report.html"
  task_manifest: "data/processed/msa_task_manifest.json"
  stage_markers:
    alignments: "data/processed/msa_alignments_complete.flag"
    trimming: "data/processed/msa_trimming_complete.flag"
    hmm_profiles: "data/processed/msa_hmm_complete.flag"
    combined_hmm: "data/processed/msa_combined_hmm_complete.flag"
    classification: "data/processed/msa_classification_complete.flag"
  classification_manifest: "data/MSA/classification/msa_classification_manifest.json"
  unprocessed_sequences_csv: "data/MSA/classification/msa_unprocessed_sequences.csv"
  global_hmm_raw: "data/MSA/combined/all_profiles_combined_raw.hmm"
  global_hmm: "data/MSA/combined/all_profiles_combined.hmm"
  hmm_filter:
    min_relent: 0.2
    min_prele: 0.2
    report_json: "data/MSA/combined/hmmstat_filter_report.json"
  classification_batches_dir: "data/MSA/classification/batches"
  classification_batches_json_dir: "data/MSA/classification/batches_json"
  classification_results_csv: "data/MSA/classification/msa_classification_assignments.csv"
  classification_stats_json: "data/MSA/classification/msa_classification_stats.json"
  assignment_integration_summary: "data/MSA/classification/msa_assignment_integration.json"
  classification_max_workers: 20           # Number of parallel hmmscan processes
  classification_threads_per_worker: 1   # Single-threaded for deterministic results
  classification_batch_size: 5000        # Sequences per batch
  classification_evalue_threshold: 1e-3  # E-value max to accept hmmscan assignment

  # Integration of orphan sequences into MSAs, scattered per clade (instead of a serial loop).
  # method: "hmmalign" = hmmalign --mapali (fast: ~115x on large clades);
  #         "mafft"    = mafft --add. Auto-fallback to mafft if hmmalign fails.
  integration_method: "hmmalign"
  integration_manifest: "data/MSA/integration/msa_integration_manifest.json"
  integration_tasks_dir: "data/MSA/integration/tasks"
  integration_results_dir: "data/MSA/integration/results"
  integration_threads_per_clade: 2       # Few threads/clade -> many clades in parallel

  # === Bottom-up MSA construction (new logic, cf. INTEGRATION_DESIGN.md) ===
  # Floor: cluster (vsearch) -> MAFFT -> trimAl -gappyout; gated climb
  # species->genus->family. Scatter per (barcode, family). Toggled via `enabled`.
  bottomup:
    enabled: true         # false = current top-down pipeline; true = bottom-up switch
    families_dir: "data/MSA/bottomup/families"
    families_manifest: "data/MSA/bottomup/families_manifest.json"
    out_dir: "data/MSA/bottomup/out"
    summary: "data/MSA/bottomup/bottomup_summary.json"
    cluster_id: 0.97       # vsearch identity threshold at the floor
    gate_ratio: 2.5        # GATE: max cols/length ratio to climb (to calibrate)
    gate_occ: 40.0         # GATE: min % of columns >=50% occupied to climb (to calibrate)
    max_group: 300         # subsample per cluster/species (bounds the compute)
    min_ref: 2             # min size of a reference MSA (otherwise -> residual hmmsearch)
    threads_per_family: 2  # few threads/family -> many families in parallel
    # Residual (singletons + unplaced) -> hmmsearch classification + integration
    residual_report: "data/MSA/bottomup/residual_report.json"
    residual_evalue: 1e-3
    residual_threads: 8
    # UNBOUNDED climb (cross-family gather): family -> order -> class -> phylum
    # as long as the gate passes. [] = bounded at the family. Stop level stays emergent.
    climbed_manifest: "data/MSA/bottomup/climbed_manifest.json"
    climb_ranks: ["order", "class", "phylum"]
    # SATIVA manifest: only validate MSAs with enough DIVERSITY (>=2 distinct taxa
    # -> real mislabel-detection power), with a secondary size floor.
    sativa_manifest: "data/MSA/bottomup/sativa_manifest.json"
    sativa_min_seqs: 4
    # Diversity gate for SATIVA. 1 = OFF (default): every MSA with >= sativa_min_seqs goes
    # to SATIVA (single-species MSAs still catch intra-cluster intruders). Raise to 2+ to
    # only validate MSAs with >=N distinct taxa (skips single-species MSAs) — this can drop
    # coverage sharply when most lineages stop at the species level.
    sativa_min_taxa: 1
    # COARSE contamination tier (cross-kingdom/phylum): classifies each MSA against the
    # profile lib (top-k consensus) and compares homology to the label. Complements SATIVA
    # (which only sees the fine intra-clade mislabels).
    contamination_report: "data/MSA/bottomup/contamination_report.json"
    contamination_flag_ranks: ["kingdom", "phylum"]
    contamination_min_score: 80.0
    contamination_top_k: 5
    # O(M^2) all-vs-all -> scattered: reps split into batches, one hmmsearch per batch.
    contamination_dir: "data/MSA/bottomup/contam"
    contamination_batch_size: 200      # reps per hmmsearch job (smaller -> more parallel)
    contamination_max_evalue: 1e-5
    contamination_search_threads: 4    # threads per batch hmmsearch


# SATIVA configuration
sativa:
  input_msa_dir: "data/MSA"
  output_dir: "data/SATIVA"
  sativa_script_path: "workflow/scripts/Sativa/sativa/sativa.py"
  timeout_seconds: 21600
  max_seq_count: 20000
  max_alignment_length: 5000
  sativa_mode: "ultrafast"
  confidence_threshold: 0.4
  taxonomy_code: "BOT"
  threads: 1
  rand_seed: 42
  barcodes: ["ITS", "ITS1", "ITS2"]
  tax_levels: ["family", "genus", "order", "species"]
  max_parallel_jobs: 120
  cleanup_temp_files: true
  temp_retention_hours: 24
  visualization_report: "reports/html/sativa_visualization_report.html"


# SATIVA integration configuration
sativa_integration:
  # CoL API configuration
  col_api:
    # Post-SATIVA CoL re-validation. Uses the SAME client as harmonize_taxo
    # (col_taxonomic_matcher): EXACT search + synonym resolution + thread-safe rate
    # limiting + pinned DOI'd release.
    dataset: "3LR"               # pinned CoL release (see CoL_api.dataset)
    max_requests_per_second: 150  # unthrottled (bottleneck = parallelism, not throughput)
    timeout_per_request: 30

  # Cache configuration
  cache:
    enabled: true
    max_memory_entries: 100000
    file_cache_path: "cache/col_validation_cache.pkl"

  # Performance tuning
  performance:
    max_workers_files: 20
    bulk_insert_size: 5000

  # Reporting
  reporting:
    export_json: true
    output_dir: "data/processed"

  # Database
  database:
    create_warnings_table: true


# Taxonomy sunburst report
taxonomy_sunburst:
  output: "reports/html/sativa_taxonomy_report.html"

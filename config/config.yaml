# Configuration logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_retention_days: 7

sequence_validation:
  min_length: 50          # Longueur minimale après nettoyage
  max_n_fraction: 0.5     # Fraction maximale de N autorisée
  valid_chars: "ACGTURYSWKMBDHVN-"  # Caractères valides

CoL_api:
  max_requests_per_second: 1000
  max_workers: 32
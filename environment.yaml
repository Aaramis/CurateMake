name: its-pipeline
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Core Python
  - python=3.10
  - pip

  # Package management
  - conda
  - mamba
  - pip
  - pip-tools

  # Core data science
  # - numpy>=1.21.0
  # - pandas>=1.3.0
  # - scipy>=1.7.0
  # - scikit-learn>=1.0.0
  # - matplotlib>=3.4.0
  # - seaborn>=0.11.0
  # - jupyter
  # - jupyterlab

  # Bioinformatics tools
  # - biopython>=1.79
  # - itsx
  # - mafft>=7.520
  # - sativa>=1.10
  # - triche>=2.0.1
  # - blast
  # - hmmer

  # Database
  - psycopg2
  - sqlalchemy
  - alembic
  - sqlite

  # Workflow
  - snakemake>=7.0
  - graphviz
  - pygraphviz
  - pandas-stubs
  - networkx

  # Documentation
  - mkdocs
  - mkdocs-material
  - mkdocstrings
  - mkdocstrings-python

  # Development tools (could be moved to dev environment)
  - black
  - flake8
  - mypy
  - pytest
  - pytest-cov
  - pre-commit

  # Install local package in development mode
  - pip:
    - -e .

# Environment variables
variables:
  PYTHONPATH: "{{ CONDA_PREFIX }}/lib/python3.10/site-packages"
  PGDATA: "{{ CONDA_PREFIX }}/pg"
  PGPORT: 5432

# Orchestration environment for CurateMake.
#
# This is the ONLY environment you activate by hand. It holds Snakemake and the
# dependencies needed to parse the Snakefile and launch jobs. The heavy
# scientific tooling (ITSx, MAFFT, trimAl, HMMER, RAxML/SATIVA, ...) lives in the
# per-rule environments under workflow/envs/ and is installed automatically by
# Snakemake when the workflow is run with `--use-conda`.
#
# Usage:
#   conda env create -f environment.yaml      # or: mamba env create -f environment.yaml
#   conda activate curatemake
#   snakemake --use-conda --cores <N>

name: curatemake
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.10
  - pip

  # Faster Conda solver used by Snakemake to build per-rule environments
  - mamba

  # Workflow engine and launch-time dependencies
  - snakemake-minimal>=7.0
  - python-dotenv      # Snakefile loads .env at parse time
  - pyyaml
  - pandas

  # DAG visualisation (snakemake --dag | dot ...)
  - graphviz
  - pygraphviz
